    <style>
      /* Global Reset for Scrolling Compatibility */
      html, body {
        width: 100%;
        height: auto;
        min-height: 100%;
        margin: 0;
        padding: 0;
        /* Ensure standard overflow handling so fallback scrolling works */
        overflow-x: hidden;
        /* CRITICAL FIX: Set background color to match brand cream to prevent "black/white" voids during fast scroll */
        background-color: #FDFCDC; 
      }
      
      /* Lenis Specific Styles (Secondary) */
      html.lenis, html.lenis body {
        height: auto;
      }
      
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      
      .lenis.lenis-scrolling iframe {
        pointer-events: none;
      }
    </style>
    <script>
